[package]
name = "thinkpad-kbd-light"
version = "0.1.0"
edition = "2021"
description = "Keyboard backlight control for ThinkPads (X1 Carbon 6th and relatives)"
license = "MIT"
build = "build.rs"

[lib]
name = "tkbl"
path = "src/lib.rs"

[[bin]]
name = "tkbl"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = ["Devices_Geolocation", "Foundation", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",      # HBRUSH, referenced by WNDCLASSEXW
    "Win32_Security",          # SECURITY_ATTRIBUTES, referenced by CreateFileW
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Optimised for a small, self-contained background binary (see notes/02-design-spec.md).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
